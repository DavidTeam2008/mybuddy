      <ellipse cx="340" cy="380" rx="160" ry="120" fill="url(#paneGlow)" clip-path="url(#bubbleClipL)"/>
      <ellipse cx="370" cy="724" rx="190" ry="96" fill="url(#paneShade)" clip-path="url(#bubbleClipL)"/>
      <use xlink:href="#bubble" transform="translate(370 520) scale(0.95) translate(-370 -520)" fill="none" stroke="#FFF4E0" stroke-opacity="0.16" stroke-width="2.5" clip-path="url(#bubbleClipL)"/>
      <use xlink:href="#bubble" fill="none" stroke="#FFF4E0" stroke-opacity="0.10" stroke-width="26" clip-path="url(#bubbleClipL)"/>
      <use xlink:href="#bubble" fill="none" stroke="#FFF4E0" stroke-opacity="0.55" stroke-width="4.5"/>
      <path d="M 228 392 A 108 108 0 0 1 336 284" fill="none" stroke="#FFF4E0" stroke-opacity="0.68" stroke-width="7" stroke-linecap="round"/>
      <path d="M 310 748 L 430 748" fill="none" stroke="#7EC8C3" stroke-opacity="0.10" stroke-width="16" stroke-linecap="round" clip-path="url(#bubbleClipL)"/>
