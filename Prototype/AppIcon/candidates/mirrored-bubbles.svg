      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
      <use xlink:href="#gapArrow" fill="#000000"/>
    </mask>
    <g id="pane">
      <use xlink:href="#bubble" fill="#C98F3F" fill-opacity="0.85"/>
