<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgInk" cx="512" cy="470" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14161C"/>
      <stop offset="0.7" stop-color="#0B0C10"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </radialGradient>
    <linearGradient id="paneFill" gradientUnits="userSpaceOnUse" x1="240" y1="290" x2="524" y2="752">
      <stop offset="0" stop-color="#E8B86D"/>
      <stop offset="0.45" stop-color="#E8B86D"/>
      <stop offset="1" stop-color="#C98F3F"/>
    </linearGradient>
    <radialGradient id="paneGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4E0" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#FFF4E0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFF4E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paneShade" cx="0.5" cy="0.5" r="0.5">
