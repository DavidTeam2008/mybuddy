    <path id="bubble" d="M 336 284 L 468 284 A 44 44 0 0 1 512 328 L 512 712 A 44 44 0 0 1 468 756 L 320 756 Q 276 768 240 782 Q 216 776 198 790 Q 208 750 228 700 L 228 392 A 108 108 0 0 1 336 284 Z"/>
    <path id="gapArrow" d="M 512 364 L 396 468 L 468 468 L 468 572 L 396 572 L 512 676 L 628 572 L 556 572 L 556 468 L 628 468 Z"/>
